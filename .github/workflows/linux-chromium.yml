name: Linux Chromium contract
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  linux-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.6.0'
          cache: npm
      - run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: |
          npm run check:docs
          npm run typecheck
          npm run lint
          npm run build
          npm test
          npm run pack:check
        env:
          CI: 'true'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: failure()
        with:
          name: lakda-linux-contract
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
