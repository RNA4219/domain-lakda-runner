<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>E2E テスト概要 | Lakda</title>


<style>
/*RESULT_CHROME*/
.overview { line-height: 1.6; font-variant-numeric: tabular-nums }
.app-label span { display: inline-block }
.overview :is(h1,h2,h3,p) { margin: 0; overflow-wrap: anywhere }
.report-head {
  display: grid; grid-template-columns: minmax(0,1.5fr) auto; align-items: end; gap: 24px;
  padding: clamp(24px,3vw,44px) 0 26px; border-bottom: 2px solid var(--blue);
}
.scope, .byline, .provenance, .snapshot, .source { color: var(--muted); font-size: .875rem }
.scope, .byline { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 12px }
.scope b { font: 600 .86rem Consolas, monospace }
.scope strong { color: var(--blue) }
.intro h1 { color: var(--blue); margin: 6px 0; font-size: clamp(28px,3.3vw,48px); line-height: 1.18; letter-spacing: -.045em }
.purpose { font-size: .94rem }
.scope-link { display:inline-flex; align-items:center; min-height:44px; font-weight:650; text-underline-offset:3px }
.summary { display: grid; grid-template-columns: auto auto; gap: 0 24px; align-content: end }
.summary .snapshot { grid-column: 1/-1; padding-bottom: 4px }
.coverage-gap { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 16px; padding: 0 0 9px; color: var(--blue) }
.coverage-gap strong { font-size: clamp(18px,2vw,27px); line-height: 1.4 }
.coverage-gap small { width: 100%; font-size: .875rem }
.summary:has(.coverage-gap:not([hidden])) .stat { display: inline-flex; gap: 3px }
.summary:has(.coverage-gap:not([hidden])) .stat strong { font-size: 1rem }
.stat { display: grid; grid-template-columns: max-content max-content; align-items: baseline; gap: 0 4px; line-height: 1.15 }
.stat + .stat { border-inline-start: 1px solid var(--line); padding-inline-start: 24px }
.stat-label { grid-column: 1/-1; font-size: .875rem; color: var(--muted) }
.stat strong { font: 600 clamp(32px,3.2vw,48px)/1.05 Bahnschrift,Arial,sans-serif; color: var(--blue) }
.stat .unit { font-size: .875rem }
.content-grid { display: grid; grid-template-columns: minmax(0,2.05fr) minmax(250px,1fr); gap: clamp(28px,4vw,64px); align-items: start; padding-top: 24px }
.results-column, .results, .history { min-width: 0 }
.section h2 { font-size: clamp(18px,1.5vw,23px); line-height: 1.4; letter-spacing: -.025em; color: var(--blue); margin-bottom: 12px }
.request-section { background: var(--selection); border-inline-start: 4px solid var(--blue); padding: 16px 20px; margin-bottom: 20px }
.request h3 { font-size: clamp(18px,1.85vw,25px); line-height: 1.45; margin: 2px 0 }
.request .machine { font-size: .94rem; margin: 8px 0 2px; color: var(--blue); font-weight: bold }
.request .check-scope { font-size: .94rem }
.request .prompt { padding-top: 8px; margin-top: 9px; border-top: 1px solid var(--line); font-weight: bold; font-size: .86rem }
.request + .request { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px }
.case { background: var(--white); border: 1px solid var(--line); padding: 16px 20px }
.case + .case, #accepted:not(:empty) + #tasks:not(:empty), #tasks:not(:empty) + #passed:not(:empty) { margin-top: 10px }
.case .byline .intent { font-size: clamp(21px,2vw,29px); line-height: 1.35; letter-spacing: -.025em }
#accepted .case { display: grid; grid-template-columns: minmax(0,1fr); gap: 1px; padding-block: 5px }
#accepted h3 { margin: 0 }
.case[data-outcome=passed] h3 { font-size: 1rem; line-height: 1.6; letter-spacing: normal }
.case[data-outcome=passed] h3 .case-label { margin-inline-end: .35em; color: var(--muted); font-size: .875rem; font-weight: normal }
#accepted .byline strong { color: var(--blue) }
.case .byline strong { color: var(--blue); font-weight: bold }
.case .byline strong::before { margin-right: .3em }
.case[data-outcome=failed] .outcome::before { content: "×" / "" }
.case[data-outcome=passed] .outcome::before { content: "✓" / "" }
.case[data-outcome=passed] { background: transparent; border: 0; border-inline-start: 3px solid #a6b7bf; padding: 8px 16px }
.case h3 { font-size: clamp(18px,1.6vw,24px); line-height: 1.4; margin: 4px 0; letter-spacing: -.02em }
.case[data-outcome=failed] h3 { font-size: clamp(20px,1.65vw,25px); line-height: 1.45; margin-block: 8px }
.case .unmet { color: var(--red) }
.case h3 .condition { display: block; text-wrap: balance; word-break: auto-phrase; line-break: strict }
.case .expect { font-size: .96rem; text-wrap: balance }
.trail { list-style: none; display: flex; margin: 16px 0 8px; padding: 12px 16px; background: var(--night); color: var(--on-night); border-radius: 3px }
.trail li { position: relative; flex: 1; min-width: 0; padding: 13px 12px 0 0; overflow-wrap: anywhere }
.trail li:not(:last-child)::after { content: ""; position: absolute; top: 3px; inset-inline: 8px 0; border-top: 1px solid #889aaa }
.trail li::before { content: ""; position: absolute; inset-inline-start: 0; top: 0; width: 8px; height: 8px; border: 2px solid var(--night-muted); border-radius: 50%; background: var(--night) }
.trail li:last-child::before { border-color: var(--signal); background: var(--signal) }
.trail .timecode { display: block; color: var(--night-muted); font: .8rem/1.4 Consolas,monospace }
.trail .step-name { font-size: .9375rem; font-weight: 600 }
.proof { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 12px }
.jump { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-weight: bold; color: var(--blue); font-size: .94rem }
.jump::after { content: "→" / "" }
.overview .finish { font-size: clamp(21px,2vw,30px); font-weight: bold; color: var(--blue); margin-bottom: 12px }
.totals { color: var(--muted); font-size: .875rem; margin-top: 8px }
.overview summary { padding: 12px 0; font-size: .94rem; font-weight: 600 }
.history { border-left: 1px solid var(--line); padding-left: clamp(18px,2vw,32px) }
.history details, .more { border-bottom: 1px solid var(--line) }
.history summary { display: grid; grid-template-columns: 9px minmax(0,1fr) auto; align-items: center; gap: 10px; min-height: 48px; line-height: 1.45 }
.history summary::before { margin: 0 }
.history .last-attempt { color: var(--muted); font-size: .8rem; font-weight: normal; white-space: nowrap }
.history .attempt { border-inline-start: 2px solid var(--line); padding-left: 10px; margin: 7px 0 }
.history .run-heading { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:0 10px }
.run-heading p { color:var(--muted) }
.history .shared-case { margin:0 0 10px; font-size:.9rem; font-weight:600; overflow-wrap:anywhere }
.attempt :is(h3,p,ul) { font-size: .9rem; margin-block: 4px }
.history .gate-link { display: block; padding-block: 8px }
.history .case-list { list-style:none; padding:0 }
.case-list li { display:flex; flex-wrap:wrap; align-items:baseline; gap:0 12px; padding:1px 0; overflow-wrap:anywhere }
.case-list li + li { border-top:1px solid var(--line) }
.case-list .case-name { flex-basis:100%; font-weight:600; color:var(--blue) }
.case-list dl { display:flex; align-items:baseline; flex-wrap:wrap; gap:2px 18px; margin:2px 0 }
.case-list dl div { display:flex; align-items:baseline; gap:6px }
.case-list dt { color:var(--muted); font-size:.83rem }
.case-list dd { margin:0 }
.case-list a { display:inline-flex; align-items:center; min-height:30px }
.case-list a:focus-visible, .request .jump:focus-visible { outline-offset:2px }
.attempt:focus-within { border-inline-start-color:var(--blue) }
@media (pointer:coarse) { .case-list a { min-height:44px } }
@media (max-width: 820px) {
  .report-head { display: block; padding: 16px 0 10px }
  .scope,.byline,.source,.provenance { font-size: .8rem }
  .intro h1 { margin-block: 4px }
  .purpose { font-size: .9rem }
  .summary { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px }
  .summary .snapshot { font-size: .8rem; padding: 0 }
  .coverage-gap { width: 100%; padding-bottom: 1px; gap: 0 12px }
  .stat { display: inline-flex; align-items: baseline; gap: 3px }
  .stat strong { font-size: 22px }
  .stat + .stat { padding-inline-start: 0; border: 0 }
  .content-grid { display: block; padding-top: 16px }
  .section h2 { margin-bottom: 8px }
  .case { padding: 12px 14px }
  .case[data-outcome=passed] { padding: 6px 0 6px 12px }
  .case[data-outcome=failed] h3 { font-size: clamp(19px,5.4vw,26px); margin: 5px 0 }
  .trail { margin: 8px 0 0; padding: 10px 12px }
  .trail .step-name { font-size: .875rem }
  .history { border-left: 0; border-top: 1px solid var(--line); margin-top: 16px; padding: 16px 0 0 }
}
@media (max-width: 510px) { .summary .snapshot { width: 100% } }
@media (max-width: 360px) { .overview .app-bar { gap: 6px } .overview .app-header .execute { font-size: 12px; padding-inline: 9px; white-space: nowrap } .content-grid { padding-top: 12px } .report-head { padding-top: 12px } .proof .provenance { font-size: .78rem } }
</style>
</head>
<body class="overview" data-snapshot="latest">
<header class="app-header"><div class="app-bar"><strong class="brand">Lakda</strong><small class="app-label"><span>画面の</span><span>自動テスト</span></small><!--LOCAL_RUN_LINK--></div></header>
<main class="app-main">
  <div class="report-head"><div class="intro">
    <p class="scope"><strong class="target">テスト対象</strong><span id="environment"></span><span>対象版 <b id="revision"></b></span></p>
    <h1 id="name"></h1>
    <p class="purpose">自動テストの結果と、人の判断が必要なケース。</p>
    <!--DOMAIN_COVERAGE_LINK-->
  </div>
  <div class="summary">
    <span class="snapshot" id="snapshot">各スイートの最新回</span>
    <div id="coverage-gap" class="coverage-gap" hidden><strong id="progress"></strong><strong id="missing-count" hidden></strong><small id="no-rate" hidden></small></div>
    <span class="stat"><span class="stat-label">不合格 </span><strong id="failed"></strong><span class="unit">件</span></span>
    <span class="stat" id="request-count"><span class="stat-label">人の判断待ち </span><strong id="waiting"></strong><span class="unit">件</span></span>
  </div>
  </div>
  <div class="content-grid"><div class="results-column">
  <section id="request-section" class="section request-section" hidden><h2>人の判断待ち</h2><div class="requests" id="decisions"></div></section>
  <section class="section" id="result-section"><h2>自動テストの結果</h2><div class="results">
    <p id="finish" class="finish" hidden>すべて合格。この回のテスト確認は完了です。</p>
    <div id="accepted"></div><div id="tasks"></div><div id="passed"></div>
    <details class="totals"><summary>件数の内訳</summary><p>判定済み <span id="evaluated"></span>／<span id="planned"></span>件</p><p id="counts"></p></details>
  </div></section>
  </div><section class="section history"><div><h2>スイートと判定の履歴</h2></div><div><div id="history"></div><div id="past-archive"></div></div></section>
  </div>
</main>
<script type="application/json" id="data">/*OVERVIEW*/</script>
<script>
const withReturn=(/*REVIEW_NAVIGATION*/)();
const d=JSON.parse(document.getElementById("data").textContent);
const el=id=>document.getElementById(id);
const make=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n;};
const labels={passed:"合格",failed:"不合格",partial:"部分実行",error:"実行エラー",not_run:"未実行",unreported:"未報告"};
const verdicts={go:"go",conditional_go:"conditional_go",no_go:"no_go",unissued:"判定未発行",disqualified:"証跡不適格"};
const url=(n,view="conclusion")=>"review.html#record-"+n+"/"+view;
if (/^#record-\d+(?:\/(?:steps|evidence|conclusion))?$/.test(location.hash)) location.replace(withReturn("review.html"+location.hash));
function link(label,href,cls,anchor){
  const a=make("a",label,cls);
  a.id=anchor; a.href=withReturn(href,anchor);
  return a;
}
function fold(text){const f=make("details");f.append(make("summary",text));return f;}
function rate(t){return t.successRate===null?"合格率は算出できない":"合格率 "+(t.successRate*100).toLocaleString("ja-JP",{maximumFractionDigits:1})+"%";}
el("name").textContent=d.name;el("revision").textContent=d.revision.slice(0,8);el("revision").title=d.revision;
document.title=d.name+" | E2E テスト概要";el("environment").textContent=d.environment==="windows-loopback-local"?"Windows ローカル":d.environment;
const t=d.totals;el("evaluated").textContent=t.evaluated;el("planned").textContent=t.planned;
if(!t.planned){
  el("coverage-gap").hidden=false;el("progress").textContent="予定ケース 0件";
}else if(t.evaluated<t.planned){
  el("coverage-gap").hidden=false;
  el("progress").textContent="判定済み "+t.evaluated+"／"+t.planned+"件";
  if(t.unreported){el("missing-count").hidden=false;el("missing-count").textContent="未報告 "+t.unreported+"件";}
  if(!t.evaluated){el("no-rate").hidden=false;el("no-rate").textContent=rate(t);}
}
const currentRequests=d.decisions.filter(q=>!q.historical), pastRequests=d.decisions.filter(q=>q.historical);
el("failed").textContent=t.failed;el("waiting").textContent=currentRequests.length;
el("counts").textContent=Object.entries(labels).filter(([key])=>t[key]||key==="passed").map(([key,label])=>label+" "+t[key]+"件").join("　");
const latest=document.body.dataset.snapshot==="latest";
if(!latest) el("snapshot").textContent="各スイートの集計済みの回";
el("finish").hidden=!(latest && t.planned>0 && t.passed===t.planned && !currentRequests.length);
function caseRow(c) {
  const row=make("article",null,"case");row.dataset.outcome=c.outcome;
  const byline=make("p",null,"byline");
  const runLabel=c.suite+" · 第"+c.attempt+"回";
  if(c.finding){
    const assessment=make("span","ケース判定 ");
    assessment.append(make("strong",labels[c.outcome],"outcome"));
    byline.append(make("strong",c.title,"intent"),assessment);
  }else{
    if(c.outcome!=="passed")byline.append(make("strong",labels[c.outcome],"outcome"));
    byline.append(make("span",runLabel));
  }
  row.append(byline);
  const heading=make("h3");
  if(c.finding){
    heading.append(c.finding.context,document.createElement("wbr"),make("span",c.finding.condition,c.finding.unmet?"condition unmet":"condition"));
  }else if(c.outcome==="passed"){
    heading.append(make("span","合格したケース","case-label outcome"),"「"+c.title+"」");
  }else heading.textContent=c.title;
  row.append(heading);
  if(!c.finding)for(const condition of c.criteria)row.append(make("p",(c.unmet===condition?"未達条件　":c.outcome==="passed"?"":"受入条件　")+condition,"expect"+(c.unmet===condition?" unmet":"")));
  if(c.finding?.trail?.length){
    const trail=make("ol",null,"trail");trail.setAttribute("aria-label","判定直前の操作と録画開始からの経過時間");
    for(const step of c.finding.trail){
      const item=make("li");
      const status={failed:"失敗",skipped:"未実行",blocked:"中断"};
      const label=step.status==="completed" ? step.name : step.name+"（"+(status[step.status]??step.status)+"）";
      item.append(make("span",(step.offsetMs/1000).toFixed(3)+" 秒","timecode"),make("span",label,"step-name"));
      trail.append(item);
    }
    row.append(trail);
  }
  if(c.outcome!=="passed"){
    const steps=c.showSteps && c.outcome==="failed";
    const proof=make("div",null,"proof");
    proof.append(link(c.casePage?"今回の操作ログを見る":steps?"操作と未達条件を見る":"この回の記録を見る",c.casePage??url(c.number,steps?"steps":"conclusion"),"jump","case-"+c.anchor));
    if(c.finding)proof.append(make("span",runLabel,"provenance"));
    row.append(proof);
  }
  return row;
}
const order=["failed","error","partial","unreported","not_run"];
for(const c of d.latest.filter(c=>c.outcome!=="passed").sort((a,b)=>order.indexOf(a.outcome)-order.indexOf(b.outcome)))el("tasks").append(caseRow(c));
const requested=new Set(currentRequests.map(q=>q.number));
const passed=d.latest.filter(c=>c.outcome==="passed" && !requested.has(c.number));
if(passed.length){
  const completeCases=new Set(d.suites.map(suite=>suite.attempts[0])
    .filter(run=>run.totals.passed===run.totals.planned).flatMap(run=>run.cases.map(c=>c.number)));
  const representative=t.failed>0 && passed.find(c=>completeCases.has(c.number));
  const first=representative || passed[0];
  el(representative?"accepted":"passed").append(caseRow(first));
  if(passed.length>1){
    const more=fold("ほかの合格 "+(passed.length-1)+"件");more.className="more";
    for(const c of passed)if(c!==first)more.append(caseRow(c));
    el("passed").append(more);
  }
}
if(t.planned>0 && t.planned===t.passed && !passed.length)el("result-section").querySelector("h2").hidden=true;
if(!t.planned)el("tasks").append(make("p","予定されたテストはありません。","empty"));
function requestCard(q){
  const row=make("article",null,"request");
  const source=make("p",null,"byline");
  source.append(make("span",(q.historical?"過去の実行":"最新の実行")+" · 第"+q.attempt+"回"),make("span",q.suite),make("span",q.title));
  row.append(source,make("p","ケースの自動判定　"+labels[q.outcome],"machine"));
  if(q.checkScope)row.append(make("p",q.checkScope,"check-scope"));
  row.append(make("p",q.historical?"当時の問い":"人に確かめてほしいこと","prompt"),make("h3",q.question),
    link(q.historical?"当時の依頼と操作ログを見る":"依頼と操作ログを見る",q.page,"jump","request-"+q.anchor));
  return row;
}
for(const q of currentRequests)el("decisions").append(requestCard(q));
el("request-section").hidden=!currentRequests.length;
if(pastRequests.length){
  const past=fold("過去の判断依頼 "+pastRequests.length+"件");past.id="past-requests";past.firstElementChild.id="past-heading";
  for(const q of pastRequests)past.append(requestCard(q));el("past-archive").append(past);
}
for(const suite of d.suites){
  const f=fold(suite.name);
  const summary=f.firstElementChild;
  summary.replaceChildren(make("span",suite.name),make("span","第"+suite.attempts[0].attempt+"回","last-attempt"));
  const sample=suite.attempts[0].cases[0];
  const shared=sample && suite.attempts.every(run=>run.cases.length===1 && run.cases[0].id===sample.id && run.cases[0].title===sample.title);
  if(shared)f.append(make("p","ケース「"+sample.title+"」","shared-case"));
  for(const [i,run] of suite.attempts.entries()){
    const block=make("div",null,"attempt"),t=run.totals,items=make("ul",null,"case-list");
    const header=make("div",null,"run-heading");
    header.append(make("h3","第"+run.attempt+"回"+(i===0?"（最新）":"")),make("p","判定済み "+t.evaluated+"／"+t.planned+"件　"+rate(t)));
    block.append(header);
    for(const c of run.cases){
      const li=make("li"), facts=make("dl"), outcome=make("div"), release=make("div"), value=make("dd");
      outcome.append(make("dt","ケース"),make("dd",labels[c.outcome]));
      const verdict=(c.localVerdict?"ローカル ":"")+(c.state==="unissued"?"未発行":verdicts[c.state]);
      const gate=link(verdict,url(c.number),"gate-result","history-"+c.anchor);
      gate.setAttribute("aria-label",c.title+"のリリース判定　"+verdict);
      value.append(gate);release.append(make("dt","リリース判定"),value);
      facts.append(outcome,release);
      if(!shared)li.append(make("p","「"+c.title+"」","case-name"));
      li.append(facts);
      if(c.casePage)li.append(link("操作ログ",c.casePage,"log-link","log-"+c.anchor));
      items.append(li);
    }
    block.append(items);f.append(block);
  }el("history").append(f);
}
if(d.gates.length){const f=fold("組織のリリース承認に関する記録");for(const g of d.gates)f.append(link(verdicts[g.state]+"の理由を見る · "+g.profile,url(g.number),"gate-link","gate-"+g.anchor));el("history").append(f);}
function restoreOrigin(){
  const origin=el(location.hash.slice(1));
  if(!origin?.matches("main a[id]"))return;
  for(let parent=origin.closest("details");parent;parent=parent.parentElement.closest("details"))parent.open=true;
  origin.focus({preventScroll:true});
  origin.scrollIntoView({block:"center"});
}
window.addEventListener("hashchange",restoreOrigin);
restoreOrigin();
</script></body></html>
