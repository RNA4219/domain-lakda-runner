<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>ケースの検証結果 | Lakda</title>
<style>
/*RESULT_CHROME*/
.case-page { line-height: 1.55; font-variant-numeric: tabular-nums; --tone: var(--blue) }
* { box-sizing: border-box }
[hidden] { display: none !important }
body, h1, h2, p, dl, dd, ol { margin: 0 }
.case-page:not(.case-failure) .app-main { padding-top: clamp(20px, 3vw, 40px) }
h1 { font-size: clamp(1.7rem, 3.4vw, 2.6rem); line-height: 1.22; letter-spacing: -.04em }
h2 { font-size: 1.16rem; line-height: 1.45 }
.identity, .stamp, .meta, .quiet, .sub, .runline { color: var(--muted); font-size: .85rem }
.identity, .timestamp, .number { font-family: Consolas, ui-monospace, monospace }
.identity { margin-bottom: 6px; font-weight: 600 }
.top, .section-head { display: flex; align-items: end; justify-content: space-between; gap: 18px }
.top { margin-bottom: 24px }
.picker { display: grid; gap: 4px; min-width: 0; max-width: 52%; font-size: .82rem; color: var(--muted) }
select, button { color: inherit; font: inherit; cursor: pointer }
select { width: 100%; min-height: 40px; padding: 6px 8px; border: 1px solid var(--muted); border-radius: 0; background: var(--white) }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px }
.hero {
  --tone: var(--blue); --wash: var(--soft);
  display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); align-items: center;
  border: 1px solid var(--line); border-left: 5px solid var(--tone); background: var(--white);
}
.hero[data-result=failed] .values dd[data-mismatch] { color: var(--red) }
.hero[data-result=partial], .hero[data-result=error] { --tone: var(--blue); --wash: var(--soft) }
.finding, #compare:not(:empty) { padding: clamp(15px, 2.5vw, 30px) }
.finding { min-width: 0 }
.status { display: inline-block; font-size: .82rem; font-weight: 700; padding: 2px 10px; background: var(--wash); color: var(--tone); border-radius: 0 }
.finding h2 { margin: 9px 0 5px; font-size: clamp(1.2rem, 2.1vw, 1.58rem) }
.finding .sub { overflow-wrap: anywhere }
.values { display: grid; grid-template-columns: 1fr 1fr; gap: 16px }
.values div { padding-left: clamp(12px,1.7vw,24px); border-left: 1px solid var(--line) }
.values dt { font-size: .83rem; color: var(--muted) }
.values dd { font-size: clamp(1.6rem, 3.5vw, 2.65rem); font-weight: 650; line-height: 1.3; overflow-wrap: anywhere }
.values div:last-child dd { color: var(--tone) }
.receipt { grid-column: 1 / -1; border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; padding: 9px clamp(15px, 2.5vw, 30px); background: var(--soft); font-size: .87rem }
.receipt:empty { display: none }
.receipt strong { font-size: 1.1rem }
.receipt small { font-size: .8rem; color: var(--muted) }
.columns { display: grid; grid-template-columns: minmax(0,1.12fr) minmax(0,1fr); gap: clamp(20px,3.5vw,48px); margin-top: 26px }
.column { min-width: 0 }
.section-head { align-items: center; padding-bottom: 8px; border-bottom: 2px solid var(--ink) }
.timeline { list-style: none; padding: 0 }
.timeline li { border-bottom: 1px solid var(--line) }
.timeline li:has(.quiet), .time { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 12px; min-height: 43px }
.time { background: transparent; width: 100%; text-align: left; border: 0; box-shadow: inset 3px 0 transparent }
.time:hover { background: var(--soft) }
.time[aria-pressed=true] { background: var(--selection); box-shadow: inset 3px 0 var(--blue) }
@media (prefers-reduced-motion: no-preference) {
  .time { transition: background-color 150ms ease-out, box-shadow 150ms ease-out }
}
.action { display: flex; gap: 12px; align-items: baseline; min-width: 0; overflow-wrap: anywhere }
.number, .timestamp { font-size: .86rem }
.number, .quiet { color: var(--muted) }
.timestamp { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; white-space: nowrap }
.panel { margin-top: 24px }
.row { padding: 12px 0; border-bottom: 1px solid var(--line); display: grid; gap: 5px; overflow-wrap: anywhere }
.row strong { font-size: .92rem }
.row small, .row dt { color: var(--muted); font-size: .82rem }
.row dl { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: 2px 12px; font-size: .87rem }
.film { margin-top: 12px; background: var(--blue); color: var(--white); padding: clamp(15px,2.2vw,26px); overflow-wrap: anywhere }
.film video { width: 100%; max-height: 350px; background: #151c29; margin-bottom: 8px }
#cue { font-size: .98rem; font-weight: 650; min-height: 1.55em; margin-bottom: 8px }
#video-status, .film .quiet { color: #e1e6ef; font-size: .86rem }
.film button { min-height: 42px; margin-top: 16px; padding: 6px 16px; background: var(--white); font-weight: 650; color: var(--blue); border: 1px solid transparent; border-radius: 0 }
.film button:hover { background: white }
details { margin-top: 15px }
summary { cursor: pointer; font-size: .87rem; overflow-wrap: anywhere }
details p, .runline { margin-top: 6px; overflow-wrap: anywhere }
.meta { margin-top: 25px; padding-top: 10px; border-top: 1px solid var(--line); overflow-wrap: anywhere }
.decision .finding { grid-column: 1 / -1; overflow-wrap: anywhere }
.decision .receipt { align-items: center }
.decision #headline { max-width: 28em; margin: 8px 0 12px; font-size: clamp(23px,2.7vw,38px); line-height: 1.4; text-wrap: pretty }
.decision .status { background: var(--selection); color: var(--blue) }
.decision[data-historical] .status { background: var(--soft); color: var(--blue) }
.decision .automatic { margin: 6px 0; font-size: .96rem }
.decision .reason { margin-top: 4px; color: var(--muted); font-size: .875rem }
.case-page:has(.hero.decision) .top { margin-bottom: 12px }
.case-page:has(.hero.decision) .top>div { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap }
.case-page:has(.hero.decision) .identity { margin: 0 }
#return-scene { min-height: 44px; border: 1px solid var(--muted); border-radius: 0; padding: 6px 12px; background: var(--white); margin-top: 8px }
.case-page:has(.hero.decision) #choose { margin: 0 0 8px }
.scene-label { font-size: .82rem; font-weight: 600; color: var(--blue) }
@media (max-width: 720px) {
  .app-bar { flex-wrap: wrap; gap: 0 10px; padding-block: 5px }
  .header-meta { max-width: 43%; overflow-wrap: anywhere }
  .case-page:has(.hero.decision) .app-label { display:none }
  .top, .columns { display: grid; grid-template-columns: minmax(0,1fr); gap: 14px }
  .top { margin-bottom: 16px }
  .picker { max-width: 100% }
  .hero { grid-template-columns: minmax(0,1fr) }
  #compare:not(:empty) { padding-top: 0 }
  .values div { padding-left: 10px }
  .receipt { gap: 2px 10px }
  .receipt small { width: 100% }
  .columns { gap: 22px }
  .stamp { font-size: .74rem }

}

/* 失敗の確認では実際の操作ログを一本の線に沿って読む。 */
.case-failure main{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);column-gap:clamp(30px,5vw,86px);align-items:start}
.case-failure .top,.case-failure #gate-back,.case-failure footer{grid-column:1/-1}
.case-failure .top{display:flex;margin:0}.case-failure .top>div{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.case-failure .top p{margin:0}.case-failure .top .identity{color:var(--muted)}
.case-failure #hero{display:block;background:transparent;border:0;color:var(--ink);padding:22px 0 0;margin:0}
.case-failure .finding{padding:0}
.case-failure .status{font-size:14px;color:var(--ink);background:none;border:0;border-radius:0;padding:0}
.case-failure #headline{margin:18px 0 12px;font-size:clamp(29px,3.25vw,48px);line-height:1.31;letter-spacing:-.045em;overflow-wrap:anywhere}
.case-failure #headline span{display:block}.case-failure #headline .unmet{color:var(--red)}
.case-failure .sub,.case-failure .values dt{color:var(--muted)}
.case-failure #compare:not(:empty){border-top:1px solid var(--line);margin-top:25px;padding:15px 0 0}
.case-failure .values{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.case-failure .values div{padding:0;border:0}.case-failure .values dd,.case-failure .values div:last-child dd{font-size:16px;color:var(--ink)}
.case-failure .columns{display:flex;flex-direction:column;gap:25px;margin:0;min-width:0}
.case-failure .section-head{border-bottom:1px solid var(--line);padding:0 0 9px}
.case-failure .timeline{margin:12px 0 0;padding:0;list-style:none}
.case-failure .timeline li{position:relative;border:0;padding-left:20px}
.case-failure .timeline li::before{content:"";position:absolute;top:0;bottom:0;left:5px;border-left:2px solid var(--blue)}
.case-failure .timeline li:first-child::before{top:50%}.case-failure .timeline li:last-child::before{bottom:50%}
.case-failure .timeline li::after{content:"";position:absolute;left:0;width:12px;height:12px;top:calc(50% - 6px);border:2px solid var(--blue);border-radius:50%;background:var(--paper);pointer-events:none}
.case-failure .timeline li:has([aria-pressed=true])::after{background:var(--signal)}
.case-failure .time{border:0;border-bottom:1px solid var(--line);padding:11px 8px;min-height:48px;color:var(--ink)}
.case-failure .time[aria-pressed=true]{box-shadow:none;background:var(--selection)}
.case-failure .timestamp{color:var(--blue)}.film:has(video[hidden]){color:var(--ink);background:transparent;padding:0}
.film:has(video[hidden]) :is(#video-status,.quiet){color:var(--muted)}
.film:has(video[hidden]) button{border:1px solid var(--blue);background:transparent;color:var(--blue)}
.case-failure footer{margin-top:30px}
@media(max-width:730px){
 .case-failure main{display:block}.case-failure .top{margin:0}.case-failure #hero{padding:12px 0 0}
 .case-failure #headline{margin:10px 0;font-size:clamp(24px,6.7vw,33px)}
 .case-failure #compare:not(:empty){margin-top:14px;padding-top:10px}.case-failure .columns{gap:20px;margin-top:22px}
}
.case-failure .top{padding:22px 0 14px;border-bottom:1px solid var(--line)}
.case-failure .columns{padding:24px clamp(14px,2.2vw,32px);background:var(--white);border:1px solid var(--line)}
.case-failure .timeline { background:var(--night); padding:8px 12px; border-radius:3px }
.case-failure .timeline li::before { border-color:#8395a8 }
.case-failure .timeline li::after { background:var(--night); border-color:var(--night-muted) }
.case-failure .time { color:var(--on-night); border-bottom-color:#44576b }
.case-failure .time:hover { background:#2b4053 }
.case-failure .timeline .number,.case-failure .timeline .timestamp,.case-failure .timeline .quiet { color:var(--night-muted) }
.case-failure .time[aria-pressed=true],.case-failure .time[aria-pressed=true] :is(.number,.timestamp) { color:var(--night); background:var(--selection) }
.case-failure .timeline li:has([aria-pressed=true])::after { background:var(--signal); border-color:var(--signal) }
.case-failure #headline span{text-wrap:balance;word-break:normal;line-break:strict}
.case-failure #headline .unmet{text-wrap:wrap}
.case-failure #headline .phrase{font:inherit;white-space:nowrap}
@media(max-width:730px){.case-failure .columns{padding:16px}.case-failure .top{padding:16px 0 10px}}

</style>
</head>
<body class="case-page">
<header class="app-header"><div class="app-bar"><strong class="brand">Lakda</strong><!--OVERVIEW_LINK--><span class="app-label">ケースレビュー</span><small class="header-meta" id="scope">ローカル証跡</small></div></header>
<main class="app-main">
  <p id="gate-back" hidden><a></a></p>
  <div class="top"><div><p class="identity" id="identity"></p><h1>ケースの検証結果</h1></div>
    <label class="picker">表示する実行回<select id="pick"></select></label></div>
  <section class="hero" id="hero" aria-labelledby="headline" aria-live="polite">
    <div class="finding"><p class="status" id="status"></p><h2 id="headline"></h2>
      <p id="automatic" class="automatic" hidden></p><p class="sub" id="where"></p>
      <p id="request-reason" class="reason" hidden>判断を依頼した理由は記録されていません。</p>
    </div>
    <div id="compare"></div>
    <p class="receipt" id="receipt"></p>
  </section>
  <div class="columns">
    <section class="column"><div class="section-head"><h2>操作ログ</h2><span class="stamp" id="count"></span></div>
      <ol class="timeline" id="timeline"></ol>
      <button type="button" id="return-scene" hidden>判断対象の場面に戻る</button>
      <div class="panel"><div class="section-head"><h2>受入条件の照合</h2></div><div id="checks"></div></div>
    </section>
    <section class="column"><div class="section-head"><h2>操作の動画</h2><span class="stamp" id="format"></span></div>
      <div class="film"><video id="video" controls preload="metadata" playsinline hidden aria-label="この実行回の動画"></video>
        <p id="cue"></p><p id="video-status" role="status"></p>
        <button type="button" id="choose">このPCから動画を選ぶ</button><input hidden id="file" type="file" accept="video/mp4,.mp4" aria-label="元の動画">
        <details id="location"><summary>元の動画の保存場所</summary><p id="path" class="quiet"></p></details>
      </div>
      <details><summary>実行回とケースの版</summary><p class="runline" id="run-id"></p><p class="runline" id="versions"></p><p class="runline" id="digest"></p></details>
    </section>
  </div>
  <footer class="meta" id="source"></footer>
</main>
<script type="application/json" id="data">/*CASE_DATA*/</script>
<script>
"use strict";
const withReturn=(/*REVIEW_NAVIGATION*/)();
const model = JSON.parse(document.getElementById("data").textContent);
if(document.documentElement.dataset.consoleOrigin===location.origin && model.suite?.localRunId &&
   new URLSearchParams(location.search).get("entry")==="run"){
  const home=document.querySelector(".home-link");
  const suite=model.suite;
  home.href="/run?suite="+encodeURIComponent(suite.localRunId)+"&attempt="+suite.attempt+"#"+encodeURIComponent("case-"+model.caseId);
  home.textContent="← 第"+suite.attempt+"回の実行結果";
}
const el = id => document.getElementById(id);
const outcomes = {passed:"合格",failed:"不合格",partial:"部分実行",error:"エラー"};
const reasons = {completed:"実行完了",obligations_unmet:"期待値を満たさず終了",duration_limit:"制限時間に到達",executor_error:"実行基盤でエラー",artifact_failure:"証跡の保存に失敗",machine_failure:"実行中に失敗を検出"};
const node = (tag, text) => { const n=document.createElement(tag); if(text !== undefined) n.textContent=text; return n; };
const set = (id, value) => { el(id).textContent=value; };
/*PLAYBACK*/
let current;
const playback=bindPlayback(el("video"),el("file"),el("choose"),el("video-status"),ms =>
  markAction(current.actions.findLast(a=>a.offsetMs <= ms+0.001)));
let activeSequence=null;
const valueOf = /*CASE_VALUE*/;
function measured(c,o) {
  if(c.kind === "増減件数") return valueOf(c,o.before == null || o.observed == null ? null : o.observed-o.before);
  if(o.observed !== undefined || typeof c.expected === "number") return valueOf(c,o.observed);
  return o.result === "passed" ? "条件を満たした" : "観測値の記載なし";
}
const failurePage=Boolean(model.suite && model.runs.length===1 && model.runs[0].outcome==="failed" && !model.runs[0].decision);
function stepName(id){return model.suite && Object.hasOwn(model.actionLabels,id) ? model.actionLabels[id] : id;}
function describeFailure() {
  const {context, condition, unmet} = model.finding;
  const detail=node("span",condition);
  const ending=condition.endsWith("の表示を確認できず") ? "表示を確認できず" : "確認できず";
  if(condition.endsWith(ending)){
    const phrase=node("b",ending);phrase.className="phrase";
    detail.replaceChildren(document.createTextNode(condition.slice(0,-ending.length)),document.createElement("wbr"),phrase);
  }
  if(unmet)detail.className="unmet";
  el("headline").replaceChildren(node("span",context),detail);
  document.title=context+condition+" | Lakda";
}
function showSummary(run) {
  if (run.decision) {
    const { question, acceptanceRef, excerpt, action } = run.decision;
    const historical=model.suite?.historical;
    const label=historical===true ? "過去の判断依頼 · 第"+model.suite.attempt+"回" :
      historical===false ? "今回の判断依頼 · 第"+model.suite.attempt+"回" : "業務判断の依頼";
    document.title=label+" | Lakda";
    const title=document.querySelector(".top h1");
    if(title){
      if(model.suite) title.replaceWith(node("p",model.suite.title));
      else title.remove();
      const heading=node("h1"); heading.id="headline"; el("headline").replaceWith(heading);
    }
    document.querySelector(".picker").hidden = true;
    document.querySelector(".panel").hidden = true;
    el("hero").classList.add("decision");
    el("hero").toggleAttribute("data-historical",historical===true);
    set("status",label);
    set("headline",question);
    const automatic=el("automatic");automatic.hidden=false;
    automatic.replaceChildren(node("strong","ケースの自動判定　"+(outcomes[run.outcome] ?? run.outcome)));
    if(run.decision.checkScope)automatic.append("　"+run.decision.checkScope);
    el("request-reason").hidden=false;
    set("where","受入条件　" + acceptanceRef + (excerpt ? "　" + excerpt : ""));
    el("return-scene").onclick = () => {
      selectAction(action);
      el("timeline").querySelector('[aria-pressed="true"]').focus();
    };
    el("cue").before(el("choose"));
    el("receipt").replaceChildren(node("span","判断対象の場面"), node("strong",stepName(action.actionId)),
      node("small","開始 " + (action.offsetMs / 1000).toFixed(3) + " 秒"));
    return;
  }
  const stop=run.observations.find(o=>o.result!=="passed");
  el("hero").dataset.result=run.outcome;
  set("status",outcomes[run.outcome] ?? run.outcome);
  el("compare").replaceChildren();
  set("headline",reasons[run.reason] ?? run.reason);
  set("where","受入条件 "+((model.suite?.criteria ?? model.ac).join("・") || "記載なし"));
  el("receipt").replaceChildren();
  if (model.gateRecord && model.expectedResults?.length) {
    el("receipt").append(node("strong","ケースの期待値"),node("span",model.expectedResults.join(" ／ ")));
  }
  if (model.caseId === "TC-V02") {
    const received = run.receivedOrders;
    el("receipt").append(node("span","注文の送信"), node("strong",received == null ? "不明" : received+"回"),
      node("small",received == null ? "この実行回のサーバー受信記録なし" : "試験サーバーが受け付けた POST /submit"));
  }
  if(!stop){if(failurePage)describeFailure();return;}
  const c=model.checks[stop.index-1];
  const comparison = node("dl"); comparison.className="values";
  for(const [label,value] of [["期待値",valueOf(c,c.expected)],["観測値",measured(c,stop)]]) {
    const group=node("div"), amount=node("dd",value);
    if(label==="観測値" && stop.result==="failed" && stop.observed!=null && (c.kind!=="増減件数" || stop.before!=null)) amount.dataset.mismatch="";
    group.append(node("dt",label),amount); comparison.append(group);
  }
  el("compare").append(comparison);
  set("headline",c.kind+"の確認で"+(stop.result === "partial" ? "時間切れ" : "停止"));
  const change=c.kind === "増減件数" && stop.before != null && stop.observed != null ? "　"+stop.before+"件 → "+stop.observed+"件" : "";
  set("where",[c.ref,c.action ? "対応する操作　"+stepName(c.action) : "全操作後の確認"].filter(Boolean).join("　／　")+change);
  if(failurePage)describeFailure();
}
function markAction(action) {
  const sequence=action?.sequence ?? null;
  if (sequence===activeSequence) return;
  activeSequence=sequence;
  const target=current.decision?.action;
  el("return-scene").hidden=!target || sequence===null || sequence===target.sequence;
  for (const b of el("timeline").querySelectorAll("button")) {
    b.setAttribute("aria-pressed",String(Number(b.dataset.sequence)===sequence));
  }
  set("cue",action ? stepName(action.actionId)+" の開始　"+(action.offsetMs/1000).toFixed(3)+" 秒" : "操作ログの時刻を選ぶと、その場面を指定できます。");
}
function selectAction(action) {
  markAction(action);
  playback.seek(action.offsetMs/1000);
}
function showTimeline(run) {
  const list=el("timeline"); list.replaceChildren();
  set("count","記録 "+run.actions.length+"件 ／ 予定 "+model.actions.length+"操作");
  function line(id,number){
    const row=node("li"), name=node("span"); name.className="action";
    const n=node("span",number); n.className="number"; name.append(n,node("strong",id)); row.append(name); list.append(row); return row;
  }
  for(const a of run.actions) {
    const row=line(stepName(a.actionId),String(a.sequence).padStart(2,"0"));
    const b=node("button"); b.className="time"; b.dataset.sequence=a.sequence;
    b.setAttribute("aria-pressed","false"); b.setAttribute("aria-label",stepName(a.actionId)+" の開始 "+(a.offsetMs/1000).toFixed(3)+" 秒");
    const stamp=node("span",(a.status==="failed"?"操作失敗　":"")+(a.offsetMs/1000).toFixed(3)+" 秒");
    stamp.className="timestamp"; b.append(row.firstElementChild,stamp);
    if (run.decision) {
      const target = a.sequence === run.decision.action.sequence;
      const state = {completed:"完了", failed:"失敗", skipped:"スキップ"}[a.status] ?? a.status;
      const label = node("span",(target ? "判断対象・" : "") + state); label.className="scene-label";
      b.firstElementChild.append(label);
      b.setAttribute("aria-label",b.getAttribute("aria-label")+"、"+label.textContent);
    }
    b.onclick=()=>selectAction(a); row.append(b);
  }
  const logged=new Map();
  for(const a of run.actions) logged.set(a.actionId,(logged.get(a.actionId) ?? 0)+1);
  for(const id of model.actions) {
    if(logged.get(id)>0) { logged.set(id,logged.get(id)-1); continue; }
    const label=node("span","記録なし"); label.className="quiet"; line(stepName(id),"―").append(label);
  }
}
function showChecks(run) {
  const checks=el("checks"); checks.replaceChildren();
  if (run.decision) return;
  for(const [i,c] of model.checks.entries()) {
    const records=run.observations.filter(o=>o.index===i+1);
    const row=node("div"); row.className="row";
    row.append(node("strong",c.reviewText || c.kind));
    const reference=[c.ref,c.reviewText && c.kind].filter(Boolean).join("　");
    if(reference) row.append(node("small",reference));
    const action=c.action && (Object.hasOwn(model.actionLabels,c.action) ? model.actionLabels[c.action] : c.action);
    const result=records.map(o=>(outcomes[o.result] ?? o.result)+"・"+measured(c,o)).join("、") || "判定記録なし";
    const details=node("dl");
    for(const [label,value] of [[action ? "操作直後" : "判定時点",action || "全操作後"],
      ["対象",c.targetLabel],["期待値",valueOf(c,c.expected)],["結果",result]]) {
      if(value!==undefined) details.append(node("dt",label),node("dd",value));
    }
    row.append(details);
    checks.append(row);
  }
}
function show(index) {
  current=model.runs[index]; activeSequence=null;
  showSummary(current); showTimeline(current); showChecks(current);
  const v=current.video;
  const prompt=current.decision ? "動画は未選択です。この実行回の MP4 を選ぶと、判断対象の場面を開けます。" : "この実行回の MP4 を選ぶと、照合して再生できます。";
  const allowed=playback.reset(v,prompt);
  el("location").hidden=!allowed; el("location").open=false;
  set("path",allowed ? playback.fileLocation(v.file) : ""); set("cue","操作ログの時刻を選ぶと、その場面を指定できます。");
  set("format",v.width+" × "+v.height+"　"+v.fps+" fps");
  set("run-id",model.suite ? model.suite.name+" 第"+model.suite.attempt+"回 ／ ケース内の試行 "+current.attempt :
    model.gateRecord ? "第"+current.attempt+"回" : current.runId+" ／ attempt "+current.attempt);
  if (model.gateRecord || model.suite) el("digest").hidden=true;
  else set("digest","対象コミット　"+(/^0+$/.test(current.revision) ? "未特定" : current.revision)+"　／　Manifest　"+current.manifestSha256);
  if (current.decision) {
    set("scope","ローカル証跡");
    set("source",model.suite ? "対象ケース　"+model.suite.title :
      "対象ケース　"+model.caseId+"　／　実行 ID　"+current.runId+"　／　第"+current.attempt+"回");
    selectAction(current.decision.action);
  } else if(failurePage){
    const action=current.actions.find(a=>a.sequence===model.finding.sequence);
    if(action)selectAction(action);
  }
}
set("identity",model.suite ? model.suite.name+" · 第"+model.suite.attempt+"回" : model.featureId+" ／ "+model.caseId);
if(model.suite) {
  const heading=document.querySelector(".top h1");
  if(failurePage){
    document.body.classList.add("case-failure");
    heading.replaceWith(node("p",model.suite.title));
    const finding=node("h1");finding.id="headline";el("headline").replaceWith(finding);
  }else heading.textContent=model.suite.title;
  document.querySelector(".picker").hidden=true;
}
if (Number.isSafeInteger(model.gateRecord) && model.gateRecord > 0) {
  el("gate-back").hidden=false;
  const fromSteps=new URLSearchParams(location.search).get("view")==="steps";
  const back=el("gate-back").firstElementChild;
  back.href=withReturn("index.html#record-"+model.gateRecord+(fromSteps ? "/steps" : "/conclusion"));
  back.textContent=fromSteps ? "‹ 操作の流れへ戻る" : "‹ 判定へ戻る";
}
if (model.fixtureReceipt) set("scope","ローカル検証 ／ 注文の試験画面");
set("versions","仕様 "+model.specRevision+" ／ ケース "+model.caseRevision+" ／ 期待値 "+model.oracleRevision);
set("source",model.gateRecord ? "この判定に使われた実行の記録です。" : "レビュー出典　"+model.reviewRef+"　／　"+model.caseId+"　／　ローカル閲覧用");
for(const [i,r] of model.runs.entries()) {
  const stop=r.observations.find(o=>o.result!=="passed");
  const check=stop && model.checks[stop.index-1];
  const summary=check ? "・"+check.kind+" "+measured(check,stop) : "";
  const opt=node("option",(outcomes[r.outcome] ?? r.outcome)+summary+"　"+r.startedAt.replace("T"," ").replace("Z"," UTC")+"　#"+r.attempt);
  opt.value=i; el("pick").append(opt);
}
el("pick").onchange=()=>show(Number(el("pick").value)); show(0);
</script>
</body>
