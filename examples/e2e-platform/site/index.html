<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>配送のご案内</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172c37; background: #f7f7f3; }
    main { max-width: 38rem; margin: 12vh auto; padding: 0 1.5rem; }
    h1 { font-family: Georgia, "Yu Mincho", serif; }
    details { background: white; border-block: 1px solid #b4c1c2; }
    summary, details p { padding: 1rem; }
    summary { cursor: pointer; font-weight: 600; }
    summary:focus-visible { outline: 3px solid #185d74; }
    details p { margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>配送のご案内</h1>
    <details>
      <summary data-testid="shipping-question">注文してから何日で届きますか？</summary>
      <p data-testid="shipping-answer">通常、ご注文から2〜3営業日でお届けします。</p>
    </details>
  </main>
</body>
</html>
